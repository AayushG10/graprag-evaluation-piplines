[project]
name = "graphrag-finance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "sec-edgar-downloader>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "spacy>=3.7",
    "evaluate>=0.4",
    "bert-score>=0.3",
    "transformers>=4.40",
    "torch>=2.2",
    "pyTigerGraph>=1.6",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
